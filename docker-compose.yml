# =====================================================================
# WalletFlow — Milestone 1: hạ tầng + discovery/config/gateway + auth + ledger
#   docker compose up -d --build
#
# Thứ tự khởi động (qua depends_on + healthcheck):
#   hạ tầng (postgres/kafka/redis/jaeger) -> discovery -> config -> auth/ledger -> gateway
# Các service còn lại (wallet/transaction/bank-adapter/notification)
# sẽ được thêm vào ở milestone sau.
# =====================================================================
services:

  # ---------------- HẠ TẦNG DÙNG CHUNG ----------------
  postgres:
    image: postgres:16
    container_name: wf-postgres
    environment:
      POSTGRES_USER: walletflow
      POSTGRES_PASSWORD: walletflow
      POSTGRES_DB: walletflow
    ports:
      - "5432:5432"
    volumes:
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U walletflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: wf-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Image chính chủ Apache. (bitnami/kafka:3.7 đã bị rút khỏi Docker Hub nên không pull được
  # nữa; image này dùng tiền tố KAFKA_ chứ không phải KAFKA_CFG_ như Bitnami.)
  kafka:
    image: apache/kafka:3.9.1
    container_name: wf-kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft mode (không cần Zookeeper)
      KAFKA_NODE_ID: "0"
      KAFKA_PROCESS_ROLES: "controller,broker"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Cụm 1 node: hạ replication factor của các topic nội bộ về 1.
      # Bitnami tự đặt sẵn, image Apache thì không — để mặc định 3 sẽ lỗi khi tạo
      # __consumer_offsets, tức consumer group không hoạt động được.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: wf-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI
      - "4318:4318"     # OTLP HTTP (service gửi trace vào đây)

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: wf-prometheus
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.0
    container_name: wf-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./deploy/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  # ---------------- NỀN TẢNG SPRING CLOUD ----------------
  discovery-server:
    build:
      context: .
      dockerfile: infrastructure/discovery-server/Dockerfile
    container_name: wf-discovery
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  config-server:
    build:
      context: .
      dockerfile: infrastructure/config-server/Dockerfile
    container_name: wf-config
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka/
    ports:
      - "8888:8888"
    depends_on:
      discovery-server:
        condition: service_healthy

  # ---------------- SERVICE NGHIỆP VỤ (M0: chỉ auth) ----------------
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: wf-auth
    environment: &common-env
      EUREKA_URL: http://discovery-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: walletflow
      DB_PASS: walletflow
      KAFKA_BROKERS: kafka:9092
      REDIS_HOST: redis
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      JWT_SECRET: V2FsbGV0Rmxvd1N1cGVyU2VjcmV0S2V5Rm9ySldUSFMyNTZBbGdvcml0aG0xMjM0NTY3ODkw
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  # ledger-service: nguồn sự thật về tiền. Không nằm sau Gateway (không có API công khai
  # ở M1) — nó được điều khiển qua Kafka. Vẫn map cổng 8083 để soi actuator/swagger từ host.
  ledger-service:
    build:
      context: .
      dockerfile: services/ledger-service/Dockerfile
    container_name: wf-ledger
    environment: *common-env
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  api-gateway:
    build:
      context: .
      dockerfile: infrastructure/api-gateway/Dockerfile
    container_name: wf-gateway
    environment: *common-env
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

volumes:
  pgdata:
