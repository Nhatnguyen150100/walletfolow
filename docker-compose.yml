# =====================================================================
# WalletFlow — Phase 1: hạ tầng + discovery/config/gateway + auth + ledger + wallet + transaction
#   docker compose up -d --build
#
# Thứ tự khởi động (qua depends_on + healthcheck):
#   hạ tầng (postgres/kafka/redis/jaeger) -> discovery -> config -> auth/ledger/bank-adapter
#   -> wallet -> transaction -> gateway
# bank-adapter (Phase 2.2) cần BANK_PROVIDER trong .env — xem .env.example.
# =====================================================================
services:

  # ---------------- HẠ TẦNG DÙNG CHUNG ----------------
  postgres:
    image: postgres:16
    container_name: wf-postgres
    environment:
      POSTGRES_USER: walletflow
      POSTGRES_PASSWORD: walletflow
      POSTGRES_DB: walletflow
    ports:
      - "5432:5432"
    volumes:
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U walletflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: wf-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Image chính chủ Apache. (bitnami/kafka:3.7 đã bị rút khỏi Docker Hub nên không pull được
  # nữa; image này dùng tiền tố KAFKA_ chứ không phải KAFKA_CFG_ như Bitnami.)
  kafka:
    image: apache/kafka:3.9.1
    container_name: wf-kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft mode (không cần Zookeeper)
      KAFKA_NODE_ID: "0"
      KAFKA_PROCESS_ROLES: "controller,broker"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      # Topic chỉ được sinh ra từ KafkaTopicsAutoConfiguration (common-lib). Bật auto-create lại
      # thì một lỗi gõ sai tên topic ở producer sẽ KHÔNG báo lỗi: broker tạo topic mới, nhận
      # message, không consumer nào đăng ký — lệnh tiền lặng lẽ không bao giờ được thực thi.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Cụm 1 node: hạ replication factor của các topic nội bộ về 1.
      # Bitnami tự đặt sẵn, image Apache thì không — để mặc định 3 sẽ lỗi khi tạo
      # __consumer_offsets, tức consumer group không hoạt động được.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: wf-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI
      - "4318:4318"     # OTLP HTTP (service gửi trace vào đây)

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: wf-prometheus
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.0
    container_name: wf-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./deploy/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./deploy/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  # ---------------- NỀN TẢNG SPRING CLOUD ----------------
  discovery-server:
    build:
      context: .
      dockerfile: infrastructure/discovery-server/Dockerfile
    container_name: wf-discovery
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  config-server:
    build:
      context: .
      dockerfile: infrastructure/config-server/Dockerfile
    container_name: wf-config
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka/
    ports:
      - "8888:8888"
    depends_on:
      discovery-server:
        condition: service_healthy

  # ---------------- SERVICE NGHIỆP VỤ (M0: chỉ auth) ----------------
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: wf-auth
    environment: &common-env
      EUREKA_URL: http://discovery-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: walletflow
      DB_PASS: walletflow
      KAFKA_BROKERS: kafka:9092
      REDIS_HOST: redis
      OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      # Khoá RS256 lấy từ .env — KHÔNG có giá trị mặc định. Cú pháp `:?` làm
      # `docker compose up` dừng ngay với thông báo nếu biến chưa có, thay vì khởi
      # động được bằng một khoá dev mà rồi sẽ theo lên production.
      #   cp .env.example .env && ./scripts/gen-keys.sh
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?Thiếu JWT_PRIVATE_KEY — chạy ./scripts/gen-keys.sh}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?Thiếu JWT_PUBLIC_KEY — chạy ./scripts/gen-keys.sh}
      JWKS_URI: http://auth-service:8081/.well-known/jwks.json
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  # ledger-service: nguồn sự thật về tiền. Không nằm sau Gateway (không có API công khai
  # ở M1) — nó được điều khiển qua Kafka.
  #
  # CỐ TÌNH KHÔNG map cổng ra host: service nội bộ tin tuyệt đối header X-User-*, nên bất kỳ
  # đường nào chạm tới nó mà không qua gateway đều là đường vòng qua xác thực. Cần soi
  # actuator/swagger khi debug thì dùng:
  #   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
  ledger-service:
    build:
      context: .
      dockerfile: services/ledger-service/Dockerfile
    container_name: wf-ledger
    environment: *common-env
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  # Read model của ví — suy ra từ ledger qua Kafka. Không map cổng ra host, như ledger:
  # chỉ đi vào qua gateway (header danh tính chỉ được sinh ở gateway).
  wallet-service:
    build:
      context: .
      dockerfile: services/wallet-service/Dockerfile
    container_name: wf-wallet
    environment:
      <<: *common-env
      # API nội bộ của ledger, chỉ dùng khi dựng lại ví
      LEDGER_URL: http://ledger-service:8083
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      ledger-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  # Nhận lệnh chuyển tiền (Idempotency-Key) và gửi lệnh ghi sổ qua outbox. Không map cổng ra host.
  transaction-service:
    build:
      context: .
      dockerfile: services/transaction-service/Dockerfile
    container_name: wf-transaction
    environment:
      <<: *common-env
      # API nội bộ của wallet-service — kiểm ví nguồn/ví nhận trước khi nhận lệnh
      WALLET_URL: http://wallet-service:8082
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      wallet-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  # Cầu nối tới cổng thanh toán (roadmap 2.2, ADR-016). Nhận lệnh thu qua Kafka, không có API
  # công khai, không map cổng ra host.
  bank-adapter:
    build:
      context: .
      dockerfile: services/bank-adapter/Dockerfile
    container_name: wf-bank-adapter
    environment:
      <<: *common-env
      # Không có mặc định: thiếu thì compose dừng ngay. `mock` cho máy dev — xem .env.example.
      BANK_PROVIDER: ${BANK_PROVIDER:?Thiếu BANK_PROVIDER — đặt BANK_PROVIDER=mock trong .env cho máy dev}
      # Xác nhận thứ hai cho provider giả; mặc định false (ADR-016)
      BANK_MOCK_ALLOWED: ${BANK_MOCK_ALLOWED:-false}
      # VNPay (ADR-017): chỉ dùng khi BANK_PROVIDER=vnpay. Rỗng ở đây không sao với mock; với vnpay thì
      # bank-adapter tự từ chối khởi động và nêu tên biến thiếu.
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_PAY_URL: ${VNPAY_PAY_URL:-}
      VNPAY_API_URL: ${VNPAY_API_URL:-}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-}
      VNPAY_SERVER_IP: ${VNPAY_SERVER_IP:-}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  api-gateway:
    build:
      context: .
      dockerfile: infrastructure/api-gateway/Dockerfile
    container_name: wf-gateway
    environment: *common-env
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

volumes:
  pgdata:
