# =====================================================================
# Cấu hình DÙNG CHUNG cho TẤT CẢ service (config-server phục vụ file này).
# Service nào cần override thì khai trong application.yml riêng của nó.
# =====================================================================

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0   # Lấy mẫu 100% trace cho môi trường học/dev
  observations:
    key-values:
      application: ${spring.application.name}

# Cấu hình Kafka dùng chung.
#
# Toàn hệ thống truyền message dưới dạng CHUỖI JSON của EventEnvelope, nên serializer hai đầu đều là
# String. Consumer tự parse envelope bằng ObjectMapper (xem EnvelopeReader ở common-lib) thay vì
# dùng JsonDeserializer, vì:
#   - JsonDeserializer suy kiểu qua header __TypeId__ hoặc `spring.json.value.default.type`, tức là
#     kiểu Java của producer bị rò ra thành phần của hợp đồng message giữa các service;
#   - EventEnvelope<T> là generic, ánh xạ nó qua cấu hình rất dễ sai và chỉ nổ lúc runtime;
#   - parse tường minh cho phép đọc envelope trước, quyết định rồi mới parse payload.
spring:
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Tự commit offset là sai với luồng tiền: offset chỉ được commit SAU KHI transaction nghiệp vụ
      # (gồm cả bản ghi dedup) đã commit, nếu không thì crash giữa hai bước làm mất message.
      enable-auto-commit: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    listener:
      ack-mode: record
