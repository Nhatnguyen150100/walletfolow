server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      discovery:
        locator:
          # TẮT. Khi bật, MỌI service đăng ký Eureka tự động có một đường vào qua
          # /{service-id}/** — kể cả service không hề định công khai (ledger-service là
          # nguồn sự thật về tiền và không có API công khai nào). Bề mặt tấn công khi đó
          # là hệ quả của việc service có đăng ký danh bạ hay không, chứ không phải của
          # một quyết định tường minh. Route nào cần public thì khai dưới đây.
          enabled: false
      routes:
        # Đăng nhập/đăng ký: công khai + rate limit theo IP (chống brute-force)
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@ipKeyResolver}"
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10

        # JWKS: công khai (chỉ chứa public key) để client/công cụ tự verify được token
        - id: auth-jwks
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/.well-known/**

        # Công cụ quản trị read model của ví (rebuild). Vẫn qua JWT như mọi path /api/v1/**;
        # wallet-service tự kiểm X-User-Role = ADMIN.
        - id: wallet-admin
          uri: lb://WALLET-SERVICE
          predicates:
            - Path=/api/v1/admin/wallets/**

        # ----- Các route sau sẽ hoạt động khi service tương ứng ra đời (milestone sau) -----
        # Lệnh ghi tiền: rate limit theo user đã xác thực (chống spam giao dịch)
        - id: transaction-service
          uri: lb://TRANSACTION-SERVICE
          predicates:
            - Path=/api/v1/transactions/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@userKeyResolver}"
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
        - id: wallet-service
          uri: lb://WALLET-SERVICE
          predicates:
            - Path=/api/v1/wallets/**

        # Webhook/IPN của cổng thanh toán (roadmap 2.3): CÔNG KHAI, provider không có JWT của ta.
        # Ranh giới tin cậy là CHỮ KÝ, bank-adapter kiểm trước khi đọc bất cứ thứ gì trong payload.
        # Rate limit theo IP: endpoint này ai cũng gọi được, và provider thật gửi rất thưa.
        - id: bank-webhooks
          uri: lb://BANK-ADAPTER
          predicates:
            - Path=/webhooks/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@ipKeyResolver}"
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40

jwt:
  # Gateway CHỈ verify. Nó lấy public key qua JWKS và không hề biết private key —
  # nên gateway bị chiếm cũng không phát hành được token. Xem ADR-009.
  jwks-uri: ${JWKS_URI:http://auth-service/.well-known/jwks.json}
  jwks-refresh-ms: ${JWKS_REFRESH_MS:300000}
  issuer: ${JWT_ISSUER:walletflow-auth}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
