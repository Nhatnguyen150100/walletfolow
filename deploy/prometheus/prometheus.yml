global:
  scrape_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

# Prometheus thu thập metrics từ endpoint /actuator/prometheus của mỗi service.
scrape_configs:
  - job_name: 'api-gateway'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['api-gateway:8080']
  - job_name: 'auth-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['auth-service:8081']
  - job_name: 'ledger-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['ledger-service:8083']
  - job_name: 'wallet-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['wallet-service:8082']
  - job_name: 'transaction-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['transaction-service:8084']
  # Các service sau sẽ được thêm target khi ra đời (milestone sau):
  # bank-adapter:8085, notification-service:8086
