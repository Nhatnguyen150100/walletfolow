# =====================================================================
# Alert rules — WalletFlow
#
# Nguyên tắc: MỖI alert phải hành động được và có runbook tương ứng trong
# docs/runbooks/. Alert không hành động được thì phải xoá — alert fatigue giết
# độ tin cậy nhanh hơn là không có alert.
# =====================================================================
groups:

  - name: walletflow-money-safety
    interval: 30s
    rules:

      # -------------------------------------------------------------
      # 🔴 DLT có message = có lệnh tiền CHƯA được xử lý
      # -------------------------------------------------------------
      # Đây là alert quan trọng nhất của hệ thống. Một message vào DLT nghĩa là
      # ledger đã từ chối xử lý nó sau khi thử lại, và không có cơ chế tự động nào
      # xử lý tiếp — giao dịch tương ứng sẽ treo vĩnh viễn nếu không có người can thiệp.
      - alert: DltNotEmpty
        expr: increase(walletflow_dlt_messages_total[5m]) > 0
        for: 0m          # không chờ: một message cũng là một giao dịch treo
        labels:
          severity: page
        annotations:
          summary: "Có message vào dead-letter topic {{ $labels.topic }}"
          description: >-
            {{ $value }} message vào DLT trong 5 phút qua ({{ $labels.exception }}).
            Mỗi message là một lệnh tiền chưa được thực thi.
          runbook: docs/runbooks/dlt-not-empty.md

      # -------------------------------------------------------------
      # 🔴 Outbox tồn đọng = relay chết hoặc Kafka không nhận
      # -------------------------------------------------------------
      # Dùng TUỔI của hàng cũ nhất chứ không dùng SỐ LƯỢNG: khi tải thấp, một relay
      # đã chết hẳn vẫn để lại số lượng hàng chờ nhỏ và trông hoàn toàn bình thường.
      # Tuổi thì tăng tuyến tính và không nói dối.
      - alert: OutboxStalled
        expr: walletflow_outbox_oldest_age_seconds > 60
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "Outbox của {{ $labels.job }} tồn đọng {{ $value }}s"
          description: >-
            Event cũ nhất trong outbox đã chờ hơn 60 giây. Relay có thể đã chết,
            hoặc Kafka không nhận được message. Giao dịch đã ghi sổ nhưng event
            chưa đi ra -> các service downstream đang lệch trạng thái.
          runbook: docs/runbooks/outbox-stalled.md

      # Cảnh báo sớm hơn, mức ticket: tồn đọng lớn nhưng vẫn đang chảy
      - alert: OutboxBacklogHigh
        expr: walletflow_outbox_pending > 500
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "Outbox của {{ $labels.job }} có {{ $value }} event chờ gửi"
          runbook: docs/runbooks/outbox-stalled.md

      # -------------------------------------------------------------
      # 🟠 Relay publish liên tục thất bại
      # -------------------------------------------------------------
      # OutboxRelay cố tình bắt mọi exception để thử lại, nên hỏng hoàn toàn trông
      # giống hệt đang rảnh. Counter này là cách duy nhất thấy được điều đó.
      - alert: OutboxPublishFailing
        expr: rate(walletflow_outbox_publish_failures_total[5m]) > 0
        for: 3m
        labels:
          severity: ticket
        annotations:
          summary: "Outbox relay của {{ $labels.job }} đang publish lỗi liên tục"
          runbook: docs/runbooks/outbox-stalled.md

      # -------------------------------------------------------------
      # 🔴 Giao dịch chuyển MANUAL_REVIEW = ledger không trả lời sau mọi lần gửi lại
      # -------------------------------------------------------------
      # Không có cơ chế tự động nào đi tiếp từ đây. Tiền có thể ĐÃ đi (bút toán ghi xong, event
      # mất) hoặc CHƯA — người dùng đang thấy giao dịch treo và chỉ người đối chiếu sổ cái mới biết.
      - alert: SagaManualReview
        expr: increase(walletflow_saga_manual_review_total[10m]) > 0
        for: 0m
        labels:
          severity: page
        annotations:
          summary: "{{ $value }} giao dịch chuyển MANUAL_REVIEW ở {{ $labels.job }}"
          description: >-
            Ledger không trả lời sau đủ số lần gửi lại. Đối chiếu từng giao dịch với sổ cái
            trước khi làm bất cứ điều gì — KHÔNG gửi lại lệnh bằng tay với transactionId mới.
          runbook: docs/runbooks/saga-stuck.md

      # -------------------------------------------------------------
      # 🔴 Lệnh nạp đã THU ĐƯỢC TIỀN nhưng không vào được ví (roadmap 2.4a, ADR-019)
      # -------------------------------------------------------------
      # Nặng hơn SagaManualReview: ở đó tiền CÓ THỂ chưa đi, ở đây ngân hàng CHẮC CHẮN đã trừ người
      # dùng — lệnh ghi sổ chỉ được gửi sau khi provider xác nhận. Mỗi ca còn lại ở đây là một thao tác
      # tay và mỗi phút là một phút khách mất tiền mà không có gì. Từ 2.4b (ADR-020), hai ca biết chắc
      # đã thu tiền được hoàn tự động và KHÔNG tăng counter này — nên alert chỉ kêu cho ca cần người.
      - alert: TopupManualReview
        expr: increase(walletflow_topup_manual_review_total[10m]) > 0
        for: 0m
        labels:
          severity: page
        annotations:
          summary: "{{ $value }} lệnh nạp đã thu tiền nhưng không vào được ví ở {{ $labels.job }}"
          description: >-
            Đối chiếu CẢ HAI nguồn (sổ cái và cổng thanh toán) theo provider_ref trước khi quyết.
            failure_code trong bảng transactions nói ca nào — xem bảng phân loại trong runbook.
          runbook: docs/runbooks/topup-stuck.md

      # bank-adapter nói hai điều trái nhau về cùng một lần thu, hoặc xác nhận lệch với lệnh đã gửi.
      # Là BUG, không phải sự cố vận hành — nhưng tiền của khách đi trước, sửa code sau.
      - alert: TopupResultConflict
        expr: increase(walletflow_topup_result_conflict_total[1h]) > 0
        for: 0m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $value }} lần kết quả thu tiền mâu thuẫn ở {{ $labels.job }}"
          runbook: docs/runbooks/topup-stuck.md

      # Hoàn tiền tự động KHÔNG thành công (2.4b, ADR-020): tiền của người dùng vẫn ở chỗ provider và
      # máy đã hết đường tự gỡ. Nặng ngang TopupManualReview — khác ở chỗ ta biết chính xác phải làm gì
      # (hoàn tay qua portal), nên runbook mục E là một quy trình chứ không phải một cuộc điều tra.
      - alert: TopupRefundFailed
        expr: increase(walletflow_topup_refund_failed_total[10m]) > 0
        for: 0m
        labels:
          severity: page
        annotations:
          summary: "{{ $value }} lệnh nạp KHÔNG hoàn được tiền ở {{ $labels.job }}"
          description: >-
            Hàng REFUND đã FAILED ở bank-adapter là vĩnh viễn — đừng gửi lại lệnh hoàn, nó chỉ phát lại
            lời từ chối cũ. Hoàn tay qua portal theo provider_ref của lần THU (runbook mục E).
          runbook: docs/runbooks/topup-stuck.md

      # Ledger TỪ CHỐI một lệnh đảo bút toán (2.5 PR4, ADR-022). Hai người đã ký vào một quyết định
      # đụng tiền mà máy không thực hiện được — gần như luôn là INSUFFICIENT_FUNDS, tức là người dùng
      # đã tiêu mất khoản được cộng nhầm. Ví vẫn giữ tiền của công ty và không còn đường tự động nào.
      - alert: ReversalRejected
        expr: increase(walletflow_topup_reversal_rejected_total[10m]) > 0
        for: 0m
        labels:
          severity: page
        annotations:
          summary: "{{ $value }} lệnh đảo bút toán bị ledger từ chối ở {{ $labels.job }}"
          description: >-
            ĐỪNG tìm cách ép ledger ghi — số dư âm là trạng thái không nơi nào xử lý được. Khoản đó
            là một khoản phải thu, không phải một bút toán. Ca ở lại hàng đợi với REVERSAL_REJECTED
            là đúng; xem runbook mục G.
          runbook: docs/runbooks/topup-stuck.md

      # Màn hình của người trực mất một nguồn ngữ cảnh (2.5 PR3, ADR-021 B2). Không phải sự cố tiền —
      # nhưng nó làm hỏng công cụ dùng để xử lý sự cố tiền, nên phải biết TRƯỚC khi cần tới nó. Ca hay
      # gặp nhất không phải mạng chập chờn mà là quên đặt LEDGER_URL/BANK_URL: lúc đó tỉ lệ là 100% và
      # đứng im, trong khi log lẫn audit chỉ ghi lại sau khi đã hỏng.
      - alert: AdminContextUnavailable
        expr: increase(walletflow_admin_context_unavailable_total[15m]) > 0
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "Màn hình người trực không hỏi được {{ $labels.service }} ({{ $value }} lần/15 phút)"
          description: >-
            Người trực đang thấy ô "{{ $labels.service }}" trống và KHÔNG được coi đó là "chưa có gì" —
            runbook dạy phân biệt bằng trường unavailable. Kiểm LEDGER_URL/BANK_URL trước, rồi tới
            sức khoẻ của service tương ứng.
          runbook: docs/runbooks/topup-stuck.md

      # Hoàn tiền tự động là ca hệ thống TỰ xử lý được, nên một lần lẻ không đánh thức ai. Nhưng tần
      # suất tăng đột biến nghĩa là ledger đang từ chối hàng loạt (ví bị đóng hàng loạt? tài khoản
      # EXTERNAL_BANK bị đóng băng?) — thứ phải nhìn thấy trước khi khách hàng kêu.
      - alert: TopupRefundRateHigh
        expr: increase(walletflow_topup_refund_started_total[15m]) > 5
        for: 0m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $value }} lệnh nạp phải hoàn tiền trong 15 phút ở {{ $labels.job }}"
          description: >-
            Nhìn failure_code của các giao dịch REFUNDING: cùng một mã của ledger cho nhiều giao dịch
            là nguyên nhân hệ thống, không phải chuyện riêng của một ví.
          runbook: docs/runbooks/topup-stuck.md

      # Gửi lại nhiều = ledger chậm hoặc message đang mất ở đâu đó — báo trước khi thành MANUAL_REVIEW
      - alert: SagaRetriesHigh
        expr: increase(walletflow_saga_retries_total[15m]) > 10
        for: 0m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $value }} lần gửi lại lệnh ghi sổ trong 15 phút ở {{ $labels.job }}"
          runbook: docs/runbooks/saga-stuck.md

      # Job quét lỗi khi xử lý một saga — saga đó bị đẩy lùi nên không chặn các saga khác, nhưng
      # sẽ lỗi lại mãi cho tới khi có người sửa dữ liệu
      - alert: SagaScanFailing
        expr: increase(walletflow_saga_scan_failures_total[30m]) > 0
        for: 0m
        labels:
          severity: ticket
        annotations:
          summary: "Job quét saga treo gặp lỗi ở {{ $labels.job }}"
          runbook: docs/runbooks/saga-stuck.md

      # Ledger ghi sổ một giao dịch đã báo FAILED cho người dùng — xem SagaService
      - alert: SagaStatusConflict
        expr: increase(walletflow_saga_status_conflict_total[1h]) > 0
        for: 0m
        labels:
          severity: ticket
        annotations:
          summary: "Giao dịch đã báo thất bại nhưng ledger ghi sổ ({{ $labels.job }})"
          description: >-
            Người dùng nhận thông báo thất bại rồi sau đó thông báo thành công. Tiền đúng theo sổ
            cái; cần liên hệ người dùng nếu họ đã thao tác dựa trên thông báo thất bại.
          runbook: docs/runbooks/saga-stuck.md

      # -------------------------------------------------------------
      # 🔴 Cổng thanh toán không trả lời — circuit breaker của bank-adapter đang mở (ADR-016)
      # -------------------------------------------------------------
      # Không mất tiền (lệnh thu chờ thử lại rồi vào DLT, không bao giờ bị đổi thành "thất bại"), nhưng
      # MỌI lần nạp tiền đang đứng, và người đã trả tiền chưa được xác nhận.
      # Tính cả HALF_OPEN: khi provider chết, mạch đi vòng OPEN -> HALF_OPEN (vài giây thử) -> OPEN. Chỉ đếm
      # OPEN thì một lần scrape rơi vào HALF_OPEN là đặt lại `for` và alert không bao giờ kêu. Tổng về 0
      # ngay khi mạch đóng lại, nên một lần mở chớp nhoáng (< 2 phút) không page.
      # Từ 2.4c đường hoàn có mạch riêng (`provider-<tên>-refund`) — loại nó ra ở đây, nó có alert riêng
      # bên dưới: hai mạch mở nói hai chuyện khác nhau và runbook xử lý khác nhau.
      - alert: PaymentProviderDown
        expr: sum by (job, name) (resilience4j_circuitbreaker_state{state=~"open|half_open", name!~".*-refund"}) == 1
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "Circuit breaker {{ $labels.name }} của {{ $labels.job }} đang mở"
          description: >-
            Provider lỗi liên tục nên bank-adapter ngừng gọi ra ngoài. Kiểm trang trạng thái của provider
            và DLT txn.command.bank-charge.v1 — KHÔNG đánh dấu thất bại bằng tay cho lần thu nào.
          runbook: docs/runbooks/payment-provider-down.md

      # Mạch của đường HOÀN mở: đường thu vẫn chạy (hai khoang tách rời — ADR-020 *Amendments* B2), nhưng
      # mỗi lệnh hoàn đang rơi vào nhánh thử lại rồi DLT. Ở đầu kia của mỗi lệnh đó là tiền đã bị trừ của
      # một người dùng mà ví chưa được cộng, nên nó không được chờ tới sáng.
      - alert: PaymentRefundProviderDown
        expr: sum by (job, name) (resilience4j_circuitbreaker_state{state=~"open|half_open", name=~".*-refund"}) == 1
        # 5m chứ không 2m như đường thu: lưu lượng hoàn thấp hơn nhiều nên mạch hoàn cần lâu hơn để gom đủ
        # lời gọi mà kết luận, và một lần mở chớp nhoáng ở đây không làm ai mất gì thêm — tiền đã nằm ngoài
        # ví từ trước, chậm thêm vài phút không đổi bản chất.
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Circuit breaker đường HOÀN TIỀN {{ $labels.name }} của {{ $labels.job }} đang mở"
          description: >-
            Lệnh hoàn không đi được. Lần thu vẫn xác nhận bình thường. Kiểm DLT
            txn.command.bank-refund.v1 và các saga đang REFUNDING; KHÔNG hoàn tay song song khi hàng REFUND
            còn NEW/PENDING — hoàn hai lần là mất tiền của ta (runbook topup-stuck mục E).
          runbook: docs/runbooks/payment-provider-down.md

      # Job đối chiếu không hỏi được provider — lần thu đang chờ chưa được chốt kết quả
      - alert: BankStatusCheckFailing
        expr: increase(walletflow_bank_status_check_failures_total[30m]) > 10
        for: 0m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $value }} lần hỏi lại trạng thái thu tiền thất bại trong 30 phút ở {{ $labels.job }}"
          runbook: docs/runbooks/payment-provider-down.md

      # Provider báo đã thu một số KHÁC số yêu cầu — adapter không báo thành công, lần thu đứng ở PENDING
      - alert: ProviderAmountMismatch
        expr: increase(walletflow_bank_amount_mismatch_total[15m]) > 0
        for: 0m
        labels:
          severity: page
        annotations:
          summary: "Provider thu lệch số tiền ở {{ $labels.job }}"
          description: >-
            Người dùng đã trả tiền nhưng số provider thu khác số yêu cầu. Ví CHƯA được cộng. Đối chiếu với
            provider trước khi làm gì — không sửa tay status sang SUCCEEDED.
          runbook: docs/runbooks/payment-provider-down.md

      # Lần thu đã quá hạn phiên + grace mà vẫn PENDING (ADR-017). Lẽ ra đã kết thúc (thành công, hoặc
      # EXPIRED khi provider khẳng định chưa thu) — còn lại tức là provider không trả lời được, báo trạng
      # thái lơ lửng (đảo giao dịch, nghi gian lận), lệch số tiền, hoặc thuộc provider cũ. 30 phút để một
      # lần provider chập chờn không mở ticket.
      - alert: PendingChargeOverdue
        expr: max by (job) (walletflow_bank_pending_overdue) > 0
        for: 30m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $value }} lần thu quá hạn mà chưa kết luận được ở {{ $labels.job }}"
          description: >-
            Tiền của người dùng có thể đã bị trừ. Tìm hàng PENDING có expires_at quá hạn trong
            provider_transactions và đối chiếu với trang quản trị của provider — KHÔNG sửa tay status.
          runbook: docs/runbooks/payment-provider-down.md

      # Lần thu đã báo EXPIRED nhưng lần hỏi xác nhận sau đó thấy provider báo đã thu / lơ lửng (ADR-017):
      # người dùng có thể đã mất tiền mà ví không được cộng. Adapter KHÔNG tự sửa trạng thái.
      - alert: ExpiredChargeNeedsReview
        expr: increase(walletflow_bank_expired_needs_review_total[1h]) > 0
        for: 0m
        labels:
          severity: page
        annotations:
          summary: "Lần thu đã báo hết hạn nhưng provider báo có tiền ở {{ $labels.job }}"
          description: >-
            Event bank.event.failed (EXPIRED) đã phát cho một lần thu mà provider nay báo đã thu hoặc trạng
            thái lơ lửng. Đối chiếu với provider, xử lý thủ công — KHÔNG sửa tay status.
          runbook: docs/runbooks/payment-provider-down.md

      # Lần thu đã báo EXPIRED nhưng dùng HẾT lượt hỏi xác nhận mà provider chưa bao giờ trả lời được
      # (ADR-017). Khác ExpiredChargeNeedsReview: ở đó ta BIẾT provider nói có tiền; ở đây ta KHÔNG BIẾT gì
      # cả — và đã thôi hỏi, nên không có gì tự giải quyết nữa. Chỉ đối soát tay với sao kê mới kết luận được.
      # Counter chứ không gauge: một gauge đếm trạng thái tích luỹ sẽ kêu mãi không tắt được (không có luồng
      # nào đưa hàng đã hết lượt ra khỏi điều kiện đếm), rồi bị mute — và ca thật sau đó không ai nhìn.
      - alert: ExpiredChargeUnconfirmed
        expr: increase(walletflow_bank_expired_unconfirmed_total[1h]) > 0
        for: 0m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $value }} lần thu hết hạn không xác nhận được ở {{ $labels.job }}"
          description: >-
            Adapter đã phát bank.event.failed (EXPIRED) rồi hỏi lại provider hết số lượt cho phép mà không
            lần nào có câu trả lời đọc được. Nếu thực tế tiền ĐÃ về thì người dùng mất tiền mà ví không được
            cộng. Tìm hàng FAILED/EXPIRED có next_check_at IS NULL và confirm_attempts >= max-confirm-attempts
            trong provider_transactions, đối soát với sao kê provider — KHÔNG sửa tay status.
          runbook: docs/runbooks/payment-provider-down.md

      # Webhook đã nhận mà worker chưa xử lý (2.3b). Ta đã trả "00 — đừng gửi lại nữa" cho provider, nên
      # hàng tồn ở đây là những tin báo KHÔNG AI ĐỌC và sẽ không bao giờ được gửi lại. Tiền vẫn an toàn nhờ
      # job đối chiếu, nhưng đường nhanh đã chết mà không ai thấy. 10 phút: worker chạy mỗi 2s nên một tồn
      # đọng thật sự phải tụt trong vài giây; còn đứng sau 10 phút là worker không chạy hoặc không qua được.
      - alert: BankWebhookBacklog
        expr: max by (job) (walletflow_bank_webhook_unprocessed) > 20
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $value }} webhook chưa xử lý ở {{ $labels.job }}"
          description: >-
            Worker webhook không tiêu hoá kịp hoặc không chạy. Kiểm walletflow_bank_webhook_failures_total và
            log của WebhookWorker; hàng nằm ở webhook_events có processed_at IS NULL.
          runbook: docs/runbooks/payment-provider-down.md

      # Webhook dùng hết lượt thử mà chưa xử lý được: thôi thử, nên không có gì tự giải quyết nữa (cùng lý lẽ
      # counter-chứ-không-gauge với ExpiredChargeUnconfirmed).
      - alert: BankWebhookAbandoned
        expr: increase(walletflow_bank_webhook_abandoned_total[1h]) > 0
        for: 0m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $value }} webhook bị bỏ sau khi hết lượt thử ở {{ $labels.job }}"
          description: >-
            Provider đã báo kết quả mà adapter không hỏi lại được lần nào. Tìm hàng outcome = 'ABANDONED'
            trong webhook_events, tra provider_ref sang provider_transactions và đối soát tay.
          runbook: docs/runbooks/payment-provider-down.md

      # Webhook của lần thu thuộc TÀI KHOẢN MERCHANT cũ: chỉ tài khoản đã tạo phiên mới tra được phiên đó,
      # nên những webhook này không bao giờ xử lý được. Dấu hiệu của một lần xoay VNPAY_TMN_CODE còn bỏ dở.
      - alert: BankWebhookForeignAccount
        expr: increase(walletflow_bank_webhook_foreign_account_total[1h]) > 0
        for: 0m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $value }} webhook thuộc tài khoản merchant cũ ở {{ $labels.job }}"
          description: >-
            Có lần thu chưa chốt của tài khoản merchant trước khi xoay VNPAY_TMN_CODE. Rà
            provider_transactions theo provider_account và đối soát tay — xem mục "Trước khi đổi tài khoản
            merchant" trong runbook.
          runbook: docs/runbooks/payment-provider-down.md

      # Webhook có CHỮ KÝ HỢP LỆ nhưng mã tham chiếu không thuộc hệ thống này. Khác hẳn counter
      # webhook.received{outcome=rejected} (người lạ gõ cửa, chuyện thường ở endpoint công khai): tới được
      # đây nghĩa là ai đó ký được bằng khoá của ta — hoặc hai môi trường đang dùng chung tài khoản merchant,
      # hoặc khoá đã lộ. Cả hai đều phải biết ngay.
      - alert: BankWebhookUnresolvedRef
        expr: increase(walletflow_bank_webhook_unresolved_total[1h]) > 0
        for: 0m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $value }} webhook ký đúng nhưng mã tham chiếu lạ ở {{ $labels.job }}"
          description: >-
            Kiểm xem có môi trường nào khác dùng chung VNPAY_TMN_CODE không. Nếu không có, coi như khoá
            VNPAY_HASH_SECRET đã lộ và xoay khoá.
          runbook: docs/runbooks/payment-provider-down.md

      # -------------------------------------------------------------
      # 🔴 Bất biến vàng SUM(postings) = 0 bị phá (roadmap 3.1, ADR-023)
      # -------------------------------------------------------------
      # Đây là alert nghiêm trọng NGANG DltNotEmpty, và theo một nghĩa thì hơn: DLT nói "một lệnh tiền
      # chưa chạy", còn cái này nói "tiền đã tự sinh hoặc bốc hơi trong sổ cái". Không có error budget
      # cho bất biến này (roadmap §3.4) nên ngưỡng là KHÁC 0, không phải "vượt một mức nào đó".
      - alert: LedgerImbalance
        expr: max by (job) (walletflow_ledger_imbalance_minor) > 0
        for: 0m          # không chờ: sổ cái lệch một đồng cũng là sổ cái sai
        labels:
          severity: page
        annotations:
          summary: "Sổ cái LỆCH {{ $value }} minor ở {{ $labels.job }}"
          description: >-
            Tổng posting khác 0. Tiền tự sinh hoặc bốc hơi. KHÔNG sửa bảng ledger (append-only, có
            trigger chặn) — tìm bút toán gây lệch trong reconciliation_breaks rồi quyết bằng REVERSAL.
          runbook: docs/runbooks/reconciliation-break.md

      # Chỗ lệch chưa có người xử lý. Dùng gauge (break đang mở) chứ không increase(): một break tồn
      # tại cho tới khi CÓ NGƯỜI đóng nó, nên alert phải kêu suốt quãng đó chứ không tắt sau cửa sổ.
      # 1 giờ để một lượt đối soát vừa phát hiện vừa tự dựng lại read model không gọi người lúc 3 giờ sáng.
      - alert: ReconciliationBreakOpen
        expr: max by (job, tier) (walletflow_reconciliation_breaks) > 0
        for: 1h
        labels:
          severity: ticket
        annotations:
          summary: "{{ $value }} chỗ lệch đối soát (tầng {{ $labels.tier }}) đang chờ người ở {{ $labels.job }}"
          description: >-
            Xem reconciliation_breaks có status = OPEN. Với tầng wallet, auto_repaired = true nghĩa là
            số dư đã đúng lại — việc còn lại là tìm nguyên nhân, break không tự đóng.
          runbook: docs/runbooks/reconciliation-break.md

      # -------------------------------------------------------------
      # 🔴 Chính JOB đối soát chết
      # -------------------------------------------------------------
      # "Job đối soát chết âm thầm còn tệ hơn không có job" (roadmap §3.1): hệ thống trông sạch đúng vì
      # không ai kiểm nữa.
      #
      # TÁCH HAI RULE THEO TẦNG, không gộp: hai tầng có chu kỳ chênh nhau 24 lần (ledger 1h, wallet 24h).
      # Một ngưỡng chung lấy theo tầng chậm sẽ cho phép job kiểm BẤT BIẾN VÀNG chết hơn hai ngày mới kêu.
      #
      # `absent()` cũng phải MANG NHÃN: absent(X) chỉ bằng 1 khi không còn series nào của X, nên một
      # biểu thức chung sẽ im lặng khi ledger-service chết mà wallet-service vẫn sống — đúng cái ca
      # alert này sinh ra để bắt.
      - alert: ReconciliationStaleLedger
        expr: |
          (time() - max(walletflow_reconciliation_last_success_timestamp{tier="ledger"}) > 3 * 3600)
          or absent(walletflow_reconciliation_last_success_timestamp{tier="ledger"})
        for: 10m
        labels:
          severity: page
          tier: ledger
        annotations:
          summary: "Đối soát sổ cái (tầng 1) không có lượt thành công nào trong 3 giờ"
          description: >-
            Bất biến SUM(postings) = 0 đang KHÔNG được kiểm. Xem reconciliation_runs ở ledgerdb: hàng
            RUNNING bỏ lại = một lượt chết giữa chừng (cửa sổ đó KHÔNG tự chạy lại); hàng FAILED = lỗi
            kỹ thuật, đọc failure_message.
          runbook: docs/runbooks/reconciliation-break.md

      - alert: ReconciliationStaleWallet
        expr: |
          (time() - max(walletflow_reconciliation_last_success_timestamp{tier="wallet"}) > 50 * 3600)
          or absent(walletflow_reconciliation_last_success_timestamp{tier="wallet"})
        for: 10m
        labels:
          severity: page
          tier: wallet
        annotations:
          summary: "Đối soát read model (tầng 2) không có lượt thành công nào trong hai đêm"
          description: >-
            Read model đang không được so với sổ cái. Ngưỡng là HAI chu kỳ: lỡ một đêm còn chờ được,
            lỡ hai đêm là có gì đó hỏng thật. Xem reconciliation_runs ở walletdb.
          runbook: docs/runbooks/reconciliation-break.md

      # Đối soát bank-adapter ↔ sổ cái (3.1 PR2a, ADR-024). Chu kỳ ngày như tầng 2 nên cùng ngưỡng hai đêm.
      - alert: ReconciliationStaleBank
        expr: |
          (time() - max(walletflow_reconciliation_last_success_timestamp{tier="bank"}) > 50 * 3600)
          or absent(walletflow_reconciliation_last_success_timestamp{tier="bank"})
        for: 10m
        labels:
          severity: page
          tier: bank
        annotations:
          summary: "Đối soát bank-adapter ↔ sổ cái không có lượt thành công nào trong hai đêm"
          description: >-
            Tiền qua cửa ngoài (provider) đang KHÔNG được so với sổ cái — một lần thu không vào sổ sẽ
            không ai thấy. Xem reconciliation_runs ở railsdb (DB của bank-adapter); lỗi hay gặp nhất là bank-adapter không gọi
            được ledger (LEDGER_URL).
          runbook: docs/runbooks/reconciliation-break.md

      # 🔴 Sổ cái ghi tiền vào mà provider không thu (ADR-024 §6). Tách khỏi ReconciliationBreakOpen
      # (ticket) vì với loại này người dùng TIÊU ĐƯỢC số tiền không ai trả, ngay bây giờ. Nguyên nhân đã
      # biết duy nhất là REFUND_POSTED_CONFLICT (lệnh nạp tới ledger sau khi đã hoàn); còn lại là lệnh ghi
      # sổ đi vòng qua saga.
      # Chiều ngược lại (PROVIDER_MONEY_NOT_POSTED) để ticket: nó có nguyên nhân đã biết là hoàn tay qua
      # portal, page mỗi lần như thế là alert fatigue.
      - alert: PostedWithoutProviderMoney
        expr: max by (job) (walletflow_reconciliation_provider_ledger_open{type="POSTED_WITHOUT_PROVIDER_MONEY"}) > 0
        for: 0m
        labels:
          severity: page
          tier: bank
        annotations:
          summary: "{{ $value }} lệnh tiền có bút toán nạp mà provider không thu"
          description: >-
            Sổ cái ghi tiền qua EXTERNAL_BANK nhiều hơn provider đã thu. Xem reconciliation_breaks ở
            railsdb (DB của bank-adapter) với type = POSTED_WITHOUT_PROVIDER_MONEY. Cân nhắc khoá ví liên quan trước khi điều tra.
          runbook: docs/runbooks/reconciliation-break.md

      # Một LƯỢT hỏng (lô lỗi, hoặc chạm trần số chỗ lệch). Khác hai alert trên: ở đó mốc thành công
      # phải GIÀ ĐI mới kêu — hàng giờ với tầng 1, hàng ngày với tầng 2. Counter này kêu ngay trong
      # đêm, nên một lượt quét bỏ dở không lặng lẽ trôi qua tới tận lần hỏng thứ hai.
      - alert: ReconciliationRunFailed
        expr: increase(walletflow_reconciliation_failures_total[1h]) > 0
        for: 0m
        labels:
          severity: ticket
        annotations:
          summary: "Một lượt đối soát (tầng {{ $labels.tier }}) kết thúc FAILED ở {{ $labels.job }}"
          description: >-
            Đọc failure_message của hàng FAILED mới nhất trong reconciliation_runs. "Chạm trần số chỗ
            lệch" nghĩa là lệch DIỆN RỘNG và quét chưa hết — ca đó leo thang ngay, đừng chờ lượt sau.
          runbook: docs/runbooks/reconciliation-break.md

  - name: walletflow-availability
    interval: 30s
    rules:

      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.job }} không scrape được"
          description: "Prometheus không lấy được metric của {{ $labels.instance }}."
          runbook: docs/runbooks/service-down.md

      - alert: HighErrorRate
        expr: |
          sum by (job) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            /
          sum by (job) (rate(http_server_requests_seconds_count[5m]))
            > 0.05
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.job }} có tỉ lệ lỗi 5xx > 5%"
          runbook: docs/runbooks/service-down.md

      # SLO: transfer nội bộ p95 < 300ms (plan §18)
      - alert: LatencyP95High
        expr: |
          histogram_quantile(0.95,
            sum by (job, le) (rate(http_server_requests_seconds_bucket[5m]))
          ) > 0.3
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.job }} p95 latency {{ $value }}s vượt SLO 300ms"

  - name: walletflow-auth-security
    interval: 60s
    rules:

      # Bùng nổ khoá tài khoản = có người đang dò mật khẩu hàng loạt
      - alert: AuthLockoutSpike
        expr: increase(http_server_requests_seconds_count{uri="/api/auth/login",status="401"}[10m]) > 50
        for: 0m
        labels:
          severity: ticket
        annotations:
          summary: "Nhiều lần đăng nhập thất bại bất thường ({{ $value }} trong 10 phút)"
          description: >-
            Có thể là tấn công dò mật khẩu. Kiểm tra bảng audit_events
            (action = LOGIN_FAILED / ACCOUNT_LOCKED) để xem tập trung vào IP hay email nào.
