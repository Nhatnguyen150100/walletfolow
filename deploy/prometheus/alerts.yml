# =====================================================================
# Alert rules — WalletFlow
#
# Nguyên tắc: MỖI alert phải hành động được và có runbook tương ứng trong
# docs/runbooks/. Alert không hành động được thì phải xoá — alert fatigue giết
# độ tin cậy nhanh hơn là không có alert.
# =====================================================================
groups:

  - name: walletflow-money-safety
    interval: 30s
    rules:

      # -------------------------------------------------------------
      # 🔴 DLT có message = có lệnh tiền CHƯA được xử lý
      # -------------------------------------------------------------
      # Đây là alert quan trọng nhất của hệ thống. Một message vào DLT nghĩa là
      # ledger đã từ chối xử lý nó sau khi thử lại, và không có cơ chế tự động nào
      # xử lý tiếp — giao dịch tương ứng sẽ treo vĩnh viễn nếu không có người can thiệp.
      - alert: DltNotEmpty
        expr: increase(walletflow_dlt_messages_total[5m]) > 0
        for: 0m          # không chờ: một message cũng là một giao dịch treo
        labels:
          severity: page
        annotations:
          summary: "Có message vào dead-letter topic {{ $labels.topic }}"
          description: >-
            {{ $value }} message vào DLT trong 5 phút qua ({{ $labels.exception }}).
            Mỗi message là một lệnh tiền chưa được thực thi.
          runbook: docs/runbooks/dlt-not-empty.md

      # -------------------------------------------------------------
      # 🔴 Outbox tồn đọng = relay chết hoặc Kafka không nhận
      # -------------------------------------------------------------
      # Dùng TUỔI của hàng cũ nhất chứ không dùng SỐ LƯỢNG: khi tải thấp, một relay
      # đã chết hẳn vẫn để lại số lượng hàng chờ nhỏ và trông hoàn toàn bình thường.
      # Tuổi thì tăng tuyến tính và không nói dối.
      - alert: OutboxStalled
        expr: walletflow_outbox_oldest_age_seconds > 60
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "Outbox của {{ $labels.job }} tồn đọng {{ $value }}s"
          description: >-
            Event cũ nhất trong outbox đã chờ hơn 60 giây. Relay có thể đã chết,
            hoặc Kafka không nhận được message. Giao dịch đã ghi sổ nhưng event
            chưa đi ra -> các service downstream đang lệch trạng thái.
          runbook: docs/runbooks/outbox-stalled.md

      # Cảnh báo sớm hơn, mức ticket: tồn đọng lớn nhưng vẫn đang chảy
      - alert: OutboxBacklogHigh
        expr: walletflow_outbox_pending > 500
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "Outbox của {{ $labels.job }} có {{ $value }} event chờ gửi"
          runbook: docs/runbooks/outbox-stalled.md

      # -------------------------------------------------------------
      # 🟠 Relay publish liên tục thất bại
      # -------------------------------------------------------------
      # OutboxRelay cố tình bắt mọi exception để thử lại, nên hỏng hoàn toàn trông
      # giống hệt đang rảnh. Counter này là cách duy nhất thấy được điều đó.
      - alert: OutboxPublishFailing
        expr: rate(walletflow_outbox_publish_failures_total[5m]) > 0
        for: 3m
        labels:
          severity: ticket
        annotations:
          summary: "Outbox relay của {{ $labels.job }} đang publish lỗi liên tục"
          runbook: docs/runbooks/outbox-stalled.md

      # -------------------------------------------------------------
      # 🔴 Giao dịch chuyển MANUAL_REVIEW = ledger không trả lời sau mọi lần gửi lại
      # -------------------------------------------------------------
      # Không có cơ chế tự động nào đi tiếp từ đây. Tiền có thể ĐÃ đi (bút toán ghi xong, event
      # mất) hoặc CHƯA — người dùng đang thấy giao dịch treo và chỉ người đối chiếu sổ cái mới biết.
      - alert: SagaManualReview
        expr: increase(walletflow_saga_manual_review_total[10m]) > 0
        for: 0m
        labels:
          severity: page
        annotations:
          summary: "{{ $value }} giao dịch chuyển MANUAL_REVIEW ở {{ $labels.job }}"
          description: >-
            Ledger không trả lời sau đủ số lần gửi lại. Đối chiếu từng giao dịch với sổ cái
            trước khi làm bất cứ điều gì — KHÔNG gửi lại lệnh bằng tay với transactionId mới.
          runbook: docs/runbooks/saga-stuck.md

      # Gửi lại nhiều = ledger chậm hoặc message đang mất ở đâu đó — báo trước khi thành MANUAL_REVIEW
      - alert: SagaRetriesHigh
        expr: increase(walletflow_saga_retries_total[15m]) > 10
        for: 0m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $value }} lần gửi lại lệnh ghi sổ trong 15 phút ở {{ $labels.job }}"
          runbook: docs/runbooks/saga-stuck.md

      # Job quét lỗi khi xử lý một saga — saga đó bị đẩy lùi nên không chặn các saga khác, nhưng
      # sẽ lỗi lại mãi cho tới khi có người sửa dữ liệu
      - alert: SagaScanFailing
        expr: increase(walletflow_saga_scan_failures_total[30m]) > 0
        for: 0m
        labels:
          severity: ticket
        annotations:
          summary: "Job quét saga treo gặp lỗi ở {{ $labels.job }}"
          runbook: docs/runbooks/saga-stuck.md

      # Ledger ghi sổ một giao dịch đã báo FAILED cho người dùng — xem SagaService
      - alert: SagaStatusConflict
        expr: increase(walletflow_saga_status_conflict_total[1h]) > 0
        for: 0m
        labels:
          severity: ticket
        annotations:
          summary: "Giao dịch đã báo thất bại nhưng ledger ghi sổ ({{ $labels.job }})"
          description: >-
            Người dùng nhận thông báo thất bại rồi sau đó thông báo thành công. Tiền đúng theo sổ
            cái; cần liên hệ người dùng nếu họ đã thao tác dựa trên thông báo thất bại.
          runbook: docs/runbooks/saga-stuck.md

      # -------------------------------------------------------------
      # 🔴 Cổng thanh toán không trả lời — circuit breaker của bank-adapter đang mở (ADR-016)
      # -------------------------------------------------------------
      # Không mất tiền (lệnh thu chờ thử lại rồi vào DLT, không bao giờ bị đổi thành "thất bại"), nhưng
      # MỌI lần nạp tiền đang đứng, và người đã trả tiền chưa được xác nhận.
      # Tính cả HALF_OPEN: khi provider chết, mạch đi vòng OPEN -> HALF_OPEN (vài giây thử) -> OPEN. Chỉ đếm
      # OPEN thì một lần scrape rơi vào HALF_OPEN là đặt lại `for` và alert không bao giờ kêu. Tổng về 0
      # ngay khi mạch đóng lại, nên một lần mở chớp nhoáng (< 2 phút) không page.
      - alert: PaymentProviderDown
        expr: sum by (job, name) (resilience4j_circuitbreaker_state{state=~"open|half_open"}) == 1
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "Circuit breaker {{ $labels.name }} của {{ $labels.job }} đang mở"
          description: >-
            Provider lỗi liên tục nên bank-adapter ngừng gọi ra ngoài. Kiểm trang trạng thái của provider
            và DLT txn.command.bank-charge.v1 — KHÔNG đánh dấu thất bại bằng tay cho lần thu nào.
          runbook: docs/runbooks/payment-provider-down.md

      # Job đối chiếu không hỏi được provider — lần thu đang chờ chưa được chốt kết quả
      - alert: BankStatusCheckFailing
        expr: increase(walletflow_bank_status_check_failures_total[30m]) > 10
        for: 0m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $value }} lần hỏi lại trạng thái thu tiền thất bại trong 30 phút ở {{ $labels.job }}"
          runbook: docs/runbooks/payment-provider-down.md

      # Provider báo đã thu một số KHÁC số yêu cầu — adapter không báo thành công, lần thu đứng ở PENDING
      - alert: ProviderAmountMismatch
        expr: increase(walletflow_bank_amount_mismatch_total[15m]) > 0
        for: 0m
        labels:
          severity: page
        annotations:
          summary: "Provider thu lệch số tiền ở {{ $labels.job }}"
          description: >-
            Người dùng đã trả tiền nhưng số provider thu khác số yêu cầu. Ví CHƯA được cộng. Đối chiếu với
            provider trước khi làm gì — không sửa tay status sang SUCCEEDED.
          runbook: docs/runbooks/payment-provider-down.md

      # Lần thu đã quá hạn phiên + grace mà vẫn PENDING (ADR-017). Lẽ ra đã kết thúc (thành công, hoặc
      # EXPIRED khi provider khẳng định chưa thu) — còn lại tức là provider không trả lời được, báo trạng
      # thái lơ lửng (đảo giao dịch, nghi gian lận), lệch số tiền, hoặc thuộc provider cũ. 30 phút để một
      # lần provider chập chờn không mở ticket.
      - alert: PendingChargeOverdue
        expr: max by (job) (walletflow_bank_pending_overdue) > 0
        for: 30m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $value }} lần thu quá hạn mà chưa kết luận được ở {{ $labels.job }}"
          description: >-
            Tiền của người dùng có thể đã bị trừ. Tìm hàng PENDING có expires_at quá hạn trong
            provider_transactions và đối chiếu với trang quản trị của provider — KHÔNG sửa tay status.
          runbook: docs/runbooks/payment-provider-down.md

      # Lần thu đã báo EXPIRED nhưng lần hỏi xác nhận sau đó thấy provider báo đã thu / lơ lửng (ADR-017):
      # người dùng có thể đã mất tiền mà ví không được cộng. Adapter KHÔNG tự sửa trạng thái.
      - alert: ExpiredChargeNeedsReview
        expr: increase(walletflow_bank_expired_needs_review_total[1h]) > 0
        for: 0m
        labels:
          severity: page
        annotations:
          summary: "Lần thu đã báo hết hạn nhưng provider báo có tiền ở {{ $labels.job }}"
          description: >-
            Event bank.event.failed (EXPIRED) đã phát cho một lần thu mà provider nay báo đã thu hoặc trạng
            thái lơ lửng. Đối chiếu với provider, xử lý thủ công — KHÔNG sửa tay status.
          runbook: docs/runbooks/payment-provider-down.md

      # Lần thu đã báo EXPIRED nhưng dùng HẾT lượt hỏi xác nhận mà provider chưa bao giờ trả lời được
      # (ADR-017). Khác ExpiredChargeNeedsReview: ở đó ta BIẾT provider nói có tiền; ở đây ta KHÔNG BIẾT gì
      # cả — và đã thôi hỏi, nên không có gì tự giải quyết nữa. Chỉ đối soát tay với sao kê mới kết luận được.
      # Counter chứ không gauge: một gauge đếm trạng thái tích luỹ sẽ kêu mãi không tắt được (không có luồng
      # nào đưa hàng đã hết lượt ra khỏi điều kiện đếm), rồi bị mute — và ca thật sau đó không ai nhìn.
      - alert: ExpiredChargeUnconfirmed
        expr: increase(walletflow_bank_expired_unconfirmed_total[1h]) > 0
        for: 0m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $value }} lần thu hết hạn không xác nhận được ở {{ $labels.job }}"
          description: >-
            Adapter đã phát bank.event.failed (EXPIRED) rồi hỏi lại provider hết số lượt cho phép mà không
            lần nào có câu trả lời đọc được. Nếu thực tế tiền ĐÃ về thì người dùng mất tiền mà ví không được
            cộng. Tìm hàng FAILED/EXPIRED có next_check_at IS NULL và confirm_attempts >= max-confirm-attempts
            trong provider_transactions, đối soát với sao kê provider — KHÔNG sửa tay status.
          runbook: docs/runbooks/payment-provider-down.md

      # Webhook đã nhận mà worker chưa xử lý (2.3b). Ta đã trả "00 — đừng gửi lại nữa" cho provider, nên
      # hàng tồn ở đây là những tin báo KHÔNG AI ĐỌC và sẽ không bao giờ được gửi lại. Tiền vẫn an toàn nhờ
      # job đối chiếu, nhưng đường nhanh đã chết mà không ai thấy. 10 phút: worker chạy mỗi 2s nên một tồn
      # đọng thật sự phải tụt trong vài giây; còn đứng sau 10 phút là worker không chạy hoặc không qua được.
      - alert: BankWebhookBacklog
        expr: max by (job) (walletflow_bank_webhook_unprocessed) > 20
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $value }} webhook chưa xử lý ở {{ $labels.job }}"
          description: >-
            Worker webhook không tiêu hoá kịp hoặc không chạy. Kiểm walletflow_bank_webhook_failures_total và
            log của WebhookWorker; hàng nằm ở webhook_events có processed_at IS NULL.
          runbook: docs/runbooks/payment-provider-down.md

      # Webhook dùng hết lượt thử mà chưa xử lý được: thôi thử, nên không có gì tự giải quyết nữa (cùng lý lẽ
      # counter-chứ-không-gauge với ExpiredChargeUnconfirmed).
      - alert: BankWebhookAbandoned
        expr: increase(walletflow_bank_webhook_abandoned_total[1h]) > 0
        for: 0m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $value }} webhook bị bỏ sau khi hết lượt thử ở {{ $labels.job }}"
          description: >-
            Provider đã báo kết quả mà adapter không hỏi lại được lần nào. Tìm hàng outcome = 'ABANDONED'
            trong webhook_events, tra provider_ref sang provider_transactions và đối soát tay.
          runbook: docs/runbooks/payment-provider-down.md

      # Webhook của lần thu thuộc TÀI KHOẢN MERCHANT cũ: chỉ tài khoản đã tạo phiên mới tra được phiên đó,
      # nên những webhook này không bao giờ xử lý được. Dấu hiệu của một lần xoay VNPAY_TMN_CODE còn bỏ dở.
      - alert: BankWebhookForeignAccount
        expr: increase(walletflow_bank_webhook_foreign_account_total[1h]) > 0
        for: 0m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $value }} webhook thuộc tài khoản merchant cũ ở {{ $labels.job }}"
          description: >-
            Có lần thu chưa chốt của tài khoản merchant trước khi xoay VNPAY_TMN_CODE. Rà
            provider_transactions theo provider_account và đối soát tay — xem mục "Trước khi đổi tài khoản
            merchant" trong runbook.
          runbook: docs/runbooks/payment-provider-down.md

      # Webhook có CHỮ KÝ HỢP LỆ nhưng mã tham chiếu không thuộc hệ thống này. Khác hẳn counter
      # webhook.received{outcome=rejected} (người lạ gõ cửa, chuyện thường ở endpoint công khai): tới được
      # đây nghĩa là ai đó ký được bằng khoá của ta — hoặc hai môi trường đang dùng chung tài khoản merchant,
      # hoặc khoá đã lộ. Cả hai đều phải biết ngay.
      - alert: BankWebhookUnresolvedRef
        expr: increase(walletflow_bank_webhook_unresolved_total[1h]) > 0
        for: 0m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $value }} webhook ký đúng nhưng mã tham chiếu lạ ở {{ $labels.job }}"
          description: >-
            Kiểm xem có môi trường nào khác dùng chung VNPAY_TMN_CODE không. Nếu không có, coi như khoá
            VNPAY_HASH_SECRET đã lộ và xoay khoá.
          runbook: docs/runbooks/payment-provider-down.md

  - name: walletflow-availability
    interval: 30s
    rules:

      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.job }} không scrape được"
          description: "Prometheus không lấy được metric của {{ $labels.instance }}."
          runbook: docs/runbooks/service-down.md

      - alert: HighErrorRate
        expr: |
          sum by (job) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            /
          sum by (job) (rate(http_server_requests_seconds_count[5m]))
            > 0.05
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.job }} có tỉ lệ lỗi 5xx > 5%"
          runbook: docs/runbooks/service-down.md

      # SLO: transfer nội bộ p95 < 300ms (plan §18)
      - alert: LatencyP95High
        expr: |
          histogram_quantile(0.95,
            sum by (job, le) (rate(http_server_requests_seconds_bucket[5m]))
          ) > 0.3
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.job }} p95 latency {{ $value }}s vượt SLO 300ms"

  - name: walletflow-auth-security
    interval: 60s
    rules:

      # Bùng nổ khoá tài khoản = có người đang dò mật khẩu hàng loạt
      - alert: AuthLockoutSpike
        expr: increase(http_server_requests_seconds_count{uri="/api/auth/login",status="401"}[10m]) > 50
        for: 0m
        labels:
          severity: ticket
        annotations:
          summary: "Nhiều lần đăng nhập thất bại bất thường ({{ $value }} trong 10 phút)"
          description: >-
            Có thể là tấn công dò mật khẩu. Kiểm tra bảng audit_events
            (action = LOGIN_FAILED / ACCOUNT_LOCKED) để xem tập trung vào IP hay email nào.
