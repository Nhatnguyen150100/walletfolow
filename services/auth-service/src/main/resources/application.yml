server:
  port: 8081

spring:
  application:
    name: auth-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/authdb
    username: ${DB_USER:walletflow}
    password: ${DB_PASS:walletflow}
  jpa:
    hibernate:
      # Flyway quản schema; Hibernate chỉ validate. KHÔNG BAO GIỜ quay lại `update`:
      # schema do Hibernate suy diễn thì không review được, không rollback được, và khác nhau
      # giữa các môi trường tuỳ theo lịch sử deploy.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: true
    # Cố tình KHÔNG bật baseline-on-migrate: authdb cũ (do ddl-auto sinh) sẽ bị Flyway từ chối
    # với thông báo rõ ràng, thay vì lặng lẽ đánh dấu V1 "đã chạy" rồi vỡ ở Hibernate validate.
    # Dựng lại: DROP DATABASE authdb; CREATE DATABASE authdb;
    baseline-on-migrate: false

jwt:
  # KHÔNG CÓ GIÁ TRỊ MẶC ĐỊNH — thiếu biến thì service phải chết lúc khởi động.
  # Sinh khoá: ./scripts/gen-keys.sh  (ghi vào .env, đã gitignore)
  private-key: ${JWT_PRIVATE_KEY}
  public-key: ${JWT_PUBLIC_KEY}
  issuer: ${JWT_ISSUER:walletflow-auth}
  # 15 phút: access token không thu hồi được, nên thời hạn ngắn chính là cơ chế thu hồi.
  access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:900}
  refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}

auth:
  # Tenant mà endpoint đăng ký/đăng nhập công khai phục vụ (roadmap 1.0b). Đây là ĐỊNH DANH, không
  # phải bí mật, nên có giá trị mặc định = tenant mặc định của giai đoạn một khách hàng. Không bao
  # giờ lấy từ request — xem AuthService.tenantId.
  tenant-id: ${AUTH_TENANT_ID:00000000-0000-0000-0000-000000000001}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
