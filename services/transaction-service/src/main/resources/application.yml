server:
  port: 8084

spring:
  application:
    name: transaction-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/txndb
    username: ${DB_USER:walletflow}
    password: ${DB_PASS:walletflow}
  jpa:
    hibernate:
      ddl-auto: validate      # Flyway quản schema; Hibernate chỉ validate
    open-in-view: false
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: true
    # txndb chưa từng được dùng trước service này — không có schema cũ nào cần baseline.
    baseline-on-migrate: false
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    consumer:
      group-id: transaction-service
      auto-offset-reset: earliest

walletflow:
  wallet:
    # API nội bộ của wallet-service — kiểm ví nguồn/ví nhận trước khi nhận lệnh. Không qua gateway.
    base-url: ${WALLET_URL:http://localhost:8082}
    connect-timeout: 1s
    read-timeout: 2s
  transaction:
    # Câu trả lời của một Idempotency-Key được giữ chừng này. Client gửi lại trong khoảng đó nhận
    # đúng câu trả lời cũ; quá hạn thì key được coi như mới.
    idempotency-ttl: PT24H
    # Saga quá hạn này mà ledger chưa trả lời = treo -> job quét gửi lại (hạn chót giãn dần)
    saga-deadline: PT2M
    saga-scan:
      interval-ms: 15000
      # Hết số lần gửi mà vẫn không có câu trả lời -> MANUAL_REVIEW + alert SagaManualReview
      max-attempts: 3
      batch-size: 50

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
