server:
  port: 8084

spring:
  application:
    name: transaction-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/txndb
    username: ${DB_USER:walletflow}
    password: ${DB_PASS:walletflow}
  jpa:
    hibernate:
      ddl-auto: validate      # Flyway quản schema; Hibernate chỉ validate
    open-in-view: false
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: true
    # txndb chưa từng được dùng trước service này — không có schema cũ nào cần baseline.
    baseline-on-migrate: false
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    consumer:
      group-id: transaction-service
      auto-offset-reset: earliest

walletflow:
  wallet:
    # API nội bộ của wallet-service — kiểm ví nguồn/ví nhận trước khi nhận lệnh. Không qua gateway.
    base-url: ${WALLET_URL:http://localhost:8082}
    connect-timeout: 1s
    read-timeout: 2s
  ledger:
    # API nội bộ của ledger — bút toán của một lệnh, cho màn hình người trực (2.5 PR3). Không qua gateway.
    # Chỉ đường ĐỌC; mọi lệnh ghi sổ vẫn đi Kafka.
    base-url: ${LEDGER_URL:http://localhost:8083}
    connect-timeout: 1s
    read-timeout: 2s
  bank:
    # API nội bộ của bank-adapter — các lần thu/hoàn của một lệnh, cho màn hình người trực (2.5 PR3).
    base-url: ${BANK_URL:http://localhost:8085}
    connect-timeout: 1s
    read-timeout: 2s
  transaction:
    # Câu trả lời của một Idempotency-Key được giữ chừng này. Client gửi lại trong khoảng đó nhận
    # đúng câu trả lời cũ; quá hạn thì key được coi như mới.
    idempotency-ttl: PT24H
    # Saga quá hạn này mà ledger chưa trả lời = treo -> job quét gửi lại (hạn chót giãn dần)
    saga-deadline: PT2M
    saga-scan:
      interval-ms: 15000
      # Hết số lần gửi mà vẫn không có câu trả lời -> MANUAL_REVIEW + alert SagaManualReview
      max-attempts: 3
      batch-size: 50
    topup:
      # Chờ bank-adapter tạo xong phiên thanh toán — việc của MÁY, tính bằng giây. Quá hạn thì job
      # quét gửi lại lệnh thu (bank-adapter idempotent, chỉ phát lại câu trả lời — ADR-016).
      charge-deadline: PT5M
      # Chờ NGƯỜI DÙNG trả tiền, tính từ lúc có trang thanh toán. Phải phủ hạn phiên 15' + grace 15'
      # của bank-adapter (ADR-017), nếu không job quét coi một lệnh nạp khoẻ mạnh là treo.
      payment-deadline: PT45M
      # Hoàn tiền TỰ ĐỘNG khi đã thu được tiền mà không ghi sổ được (2.4b, ADR-020). Mặc định TẮT và
      # chỉ được bật sau khi: (1) mọi instance ledger đã lên V6 — hàng rào rejected_topups khiến lời
      # từ chối là lời cuối cùng; (2) mọi instance transaction-service đã lên V4 + bản app này. Bật
      # sớm hơn thì một bản gửi lại của lệnh ghi sổ vẫn có thể được ghi SAU khi ta đã hoàn tiền: ví
      # được cộng và tiền cũng đã về thẻ. Tắt thì hai ca đó dừng ở MANUAL_REVIEW như 2.4a.
      refund-enabled: ${TOPUP_REFUND_ENABLED:false}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
